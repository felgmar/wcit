name: Build and publish release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 10.0.x

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Validate tag and configure installer version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v?(\d+\.){1,3}\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a supported release version. Use a version such as 1.2.3, v1.2.3, or v1.2.3-test.1."
          }

          $version = ($tag -replace '^v', '') -split '-', 2 | Select-Object -First 1
          "INNO_SETUP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INNO_SETUP_COMPILER=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and compile installer
        run: .\scripts\compile-installer-cleanup.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: installer
          path: build-installer/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: installer
          path: build-installer

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t installers < <(find build-installer -maxdepth 1 -type f -name '*.exe' -print)
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected exactly one installer executable in build-installer; found ${#installers[@]}." >&2
            exit 1
          fi

          args=(release create "$GITHUB_REF_NAME" "${installers[0]}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--draft --prerelease)
          fi

          gh "${args[@]}"
